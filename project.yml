name: DoorMap581
options:
  minimumXcodeGenVersion: 2.41.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.door581.appletest
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DoorMap581:
    type: application
    platform: iOS
    sources:
      - path: DoorMap581
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: DoorMap581/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_MODULE_NAME: DoorMap581
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - DoorMap581Tests
  DoorMap581Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DoorMap581Tests
    dependencies:
      - target: DoorMap581
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.door581.appletest.tests
        GENERATE_INFOPLIST_FILE: YES
